<svg xmlns="http://www.w3.org/2000/svg" width="900" height="160" viewBox="0 0 900 160">
<defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
  <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#000000" flood-opacity=".12"/>
</filter>
<style>
  svg{color:#FFF3B0;--primary:#FFF3B0;--secondary:#E3D3A0;--muted:#CDB46A;--accent:#FFD700;--gold:#FFD700;--highlight:#FFF3B0;--border:#B8860B}
  .primary{fill:var(--primary)}
  .secondary{fill:var(--secondary)}
  .muted{fill:var(--muted)}
  .accent{fill:var(--accent)}
  .gold{fill:var(--gold)}
  .border{stroke:var(--border)}
  .frame{stroke:var(--gold)}
  .r1{stroke:var(--highlight)}
  .bar{fill:var(--accent)}
  .peak{fill:var(--gold)}
  .inactive{fill:var(--border)}
  @media (prefers-color-scheme:light){
    svg{color:#2B2208;--primary:#2B2208;--secondary:#66521C;--muted:#7C6324;--accent:#8A6508;--gold:#8A6508;--highlight:#B8860B;--border:#B8860B}
  }
  text,image,circle,path,.b{filter:url(#shadow)}
</style>

<style>text{font-family:'Segoe UI',Helvetica,Arial,sans-serif;}</style></defs>

<text class="accent" x="450.0" y="40" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="3" fill="currentColor">LANGUAGES &amp; TECH</text>
<text class="primary" x="450.0" y="82" text-anchor="middle" font-size="22" font-weight="600" fill="currentColor"><tspan dx="0">HTML</tspan><tspan class="muted" dx="16" font-weight="300" fill="currentColor">||</tspan><tspan dx="16">CSS</tspan><tspan class="muted" dx="16" font-weight="300" fill="currentColor">||</tspan><tspan dx="16">JavaScript</tspan><tspan class="muted" dx="16" font-weight="300" fill="currentColor">||</tspan><tspan dx="16">TypeScript</tspan><tspan class="muted" dx="16" font-weight="300" fill="currentColor">||</tspan><tspan dx="16">React</tspan></text><text class="primary" x="450.0" y="124" text-anchor="middle" font-size="22" font-weight="600" fill="currentColor"><tspan dx="0">Vite</tspan><tspan class="muted" dx="16" font-weight="300" fill="currentColor">||</tspan><tspan dx="16">Node.js</tspan><tspan class="muted" dx="16" font-weight="300" fill="currentColor">||</tspan><tspan dx="16">Electron</tspan><tspan class="muted" dx="16" font-weight="300" fill="currentColor">||</tspan><tspan dx="16">SQLite</tspan><tspan class="muted" dx="16" font-weight="300" fill="currentColor">||</tspan><tspan dx="16">Git</tspan></text>
</svg>